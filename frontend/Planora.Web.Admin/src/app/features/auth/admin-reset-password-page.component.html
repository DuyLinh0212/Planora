<main class="admin-login"><section class="login-card"><span class="admin-seal">PA</span><p class="eyebrow">One-time administrator recovery</p><h1>Set a new password</h1>@if (!completed()) {<p>The reset link expires after 30 minutes and works only once.</p><form (ngSubmit)="resetAdministratorPassword()"><label>New password<input name="newPassword" [(ngModel)]="newPassword" type="password" minlength="10" autocomplete="new-password" required /></label><label>Confirm new password<input name="confirmPassword" [(ngModel)]="confirmPassword" type="password" minlength="10" autocomplete="new-password" required /></label>@if (errorMessage()) {<p class="form-error">{{ errorMessage() }}</p>}<button class="button primary wide" [disabled]="submitting()">{{ submitting() ? 'Updating password…' : 'Set new password' }}</button></form>} @else {<div class="admin-auth-success"><b>Password updated</b><p>All previous sessions have been revoked.</p><a class="button primary wide" routerLink="/login">Sign in</a></div>}<a class="admin-auth-link centered" routerLink="/forgot-password">Request another reset link</a></section></main>
