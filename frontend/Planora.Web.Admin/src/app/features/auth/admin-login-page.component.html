<main class="admin-login">
    <section class="login-card">
      <span class="admin-seal">PA</span>
      <p class="eyebrow">Restricted operations</p>
      <h1>Planora Admin</h1>
      <p>Secure access for system administrators.</p>
      <form (ngSubmit)="loginAdministrator()">
        <label>Work email<input name="email" [(ngModel)]="email" type="email" required /></label
        ><label
          >Password<input name="password" [(ngModel)]="password" type="password" required
        /></label>
        <a class="admin-auth-link" routerLink="/forgot-password">Forgot password?</a>
        @if (errorMessage()) {
          <p class="form-error">{{ errorMessage() }}</p>
        }
        <button class="button primary wide" [disabled]="submitting()">
          {{ submitting() ? 'Verifying…' : 'Sign in' }}
        </button>
      </form>
      <button class="text" type="button" (click)="previewConsole()">
        Continue with preview metadata
      </button>
    </section>
  </main>
