    <div class="md-editor" [class.md-editor--split]="viewMode() === 'split'">
      <div class="md-editor__toolbar" role="toolbar" aria-label="Định dạng Markdown">
        <div class="md-editor__group">
          <button type="button" class="md-btn" title="In đậm (Ctrl+B)" (click)="wrapSelection('**', '**', 'chữ đậm')">
            <svg lucideBold></svg>
          </button>
          <button type="button" class="md-btn" title="In nghiêng (Ctrl+I)" (click)="wrapSelection('*', '*', 'chữ nghiêng')">
            <svg lucideItalic></svg>
          </button>
          <button type="button" class="md-btn" title="Gạch ngang" (click)="wrapSelection('~~', '~~', 'chữ gạch ngang')">
            <svg lucideStrikethrough></svg>
          </button>
        </div>

        <div class="md-editor__divider"></div>

        <div class="md-editor__group">
          <button type="button" class="md-btn" title="Tiêu đề 1" (click)="insertPrefix('# ', 'Tiêu đề 1')">
            <svg lucideHeading1></svg>
          </button>
          <button type="button" class="md-btn" title="Tiêu đề 2" (click)="insertPrefix('## ', 'Tiêu đề 2')">
            <svg lucideHeading2></svg>
          </button>
          <button type="button" class="md-btn" title="Tiêu đề 3" (click)="insertPrefix('### ', 'Tiêu đề 3')">
            <svg lucideHeading3></svg>
          </button>
        </div>

        <div class="md-editor__divider"></div>

        <div class="md-editor__group">
          <button type="button" class="md-btn" title="Danh sách chấm" (click)="insertPrefix('- ', 'Mục danh sách')">
            <svg lucideList></svg>
          </button>
          <button type="button" class="md-btn" title="Danh sách số" (click)="insertPrefix('1. ', 'Mục 1')">
            <svg lucideListOrdered></svg>
          </button>
          <button type="button" class="md-btn" title="Danh sách công việc" (click)="insertPrefix('- [ ] ', 'Công việc cần làm')">
            <svg lucideListTodo></svg>
          </button>
        </div>

        <div class="md-editor__divider"></div>

        <div class="md-editor__group">
          <button type="button" class="md-btn" title="Trích dẫn" (click)="insertPrefix('> ', 'Nội dung trích dẫn')">
            <svg lucideQuote></svg>
          </button>
          <button type="button" class="md-btn" title="Khối mã (Code)" (click)="insertCodeBlock()">
            <svg lucideCode></svg>
          </button>
          <button type="button" class="md-btn" title="Bảng" (click)="insertTable()">
            <svg lucideTable></svg>
          </button>
          <button type="button" class="md-btn" title="Chèn liên kết" (click)="insertLink()">
            <svg lucideLink></svg>
          </button>
          <button type="button" class="md-btn" title="Chèn hình ảnh từ link" (click)="insertImageLink()">
            <svg lucideImage></svg>
          </button>
          <button type="button" class="md-btn md-btn--highlight" title="Tải ảnh lên" (click)="imageFileInput.click()">
            <svg lucideUpload></svg>
            <span class="md-btn__label">Tải ảnh</span>
          </button>
          <input #imageFileInput hidden type="file" accept="image/*" (change)="onUploadImage($event)" />
        </div>

        <div class="md-editor__spacer"></div>

        <div class="md-editor__group md-editor__modes">
          <button
            type="button"
            class="md-btn md-btn--mode"
            [class.active]="viewMode() === 'edit'"
            title="Chế độ soạn thảo"
            (click)="viewMode.set('edit')"
          >
            <svg lucidePenLine></svg>
            <span>Soạn thảo</span>
          </button>
          <button
            type="button"
            class="md-btn md-btn--mode"
            [class.active]="viewMode() === 'preview'"
            title="Chế độ xem trước"
            (click)="viewMode.set('preview')"
          >
            <svg lucideEye></svg>
            <span>Xem trước</span>
          </button>
          <button
            type="button"
            class="md-btn md-btn--mode"
            [class.active]="viewMode() === 'split'"
            title="Xem song song"
            (click)="viewMode.set('split')"
          >
            <svg lucideColumns2></svg>
            <span>Song song</span>
          </button>
        </div>
      </div>

      <div class="md-editor__body">
        @if (viewMode() === 'edit' || viewMode() === 'split') {
          <div class="md-editor__pane md-editor__pane--input">
            <textarea
              #textareaEl
              class="md-editor__textarea"
              [rows]="rows()"
              [placeholder]="placeholder()"
              [disabled]="disabled()"
              [ngModel]="value()"
              (ngModelChange)="onValueChange($event)"
              (keydown)="onKeyDown($event)"
              (paste)="onPaste($event)"
            ></textarea>
            @if (uploading()) {
              <div class="md-editor__uploading">
                <span>Đang tải ảnh lên…</span>
              </div>
            }
          </div>
        }

        @if (viewMode() === 'preview' || viewMode() === 'split') {
          <div class="md-editor__pane md-editor__pane--preview">
            <div class="md-editor__preview-label">Xem trước Markdown</div>
            <app-markdown [value]="value()"></app-markdown>
          </div>
        }
      </div>

      <footer class="md-editor__footer">
        <small>Hỗ trợ Markdown chuẩn &amp; Dán ảnh trực tiếp từ clipboard (Ctrl+V)</small>
        <span class="md-editor__word-count">{{ wordCount() }} từ · {{ (value() || '').length }} ký tự</span>
      </footer>
    </div>
