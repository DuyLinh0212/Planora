services:
  postgres:
    image: postgres:17-alpine
    container_name: planora-postgres
    environment:
      POSTGRES_DB: planora
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PLANORA_POSTGRES_PASSWORD:?Set PLANORA_POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - planora-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d planora"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  planora-postgres-data:
