services:
  - type: web
    name: planora-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    autoDeployTrigger: commit
    healthCheckPath: /health/live
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DOTNET_HOSTBUILDER__RELOADCONFIGONCHANGE
        value: "false"
      - key: DOTNET_USE_POLLING_FILE_WATCHER
        value: "1"
      - key: Database__ApplyMigrationsOnStartup
        value: "true"
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Jwt__Issuer
        value: Planora.Api
      - key: Jwt__Audience
        value: Planora.Frontends
      - key: Jwt__Secret
        sync: false
      - key: Cors__AllowedOrigins__0
        sync: false
      - key: Cors__AllowedOrigins__1
        sync: false
      - key: Payment__BankTransfer__BankName
        sync: false
      - key: Payment__BankTransfer__AccountName
        sync: false
      - key: Payment__BankTransfer__AccountNumber
        sync: false
      - key: Payment__BankTransfer__Branch
        sync: false
      - key: Payment__BankTransfer__PaymentReferencePrefix
        value: PLN
      - key: Payment__BankTransfer__SePayWebhookApiKey
        sync: false
      - key: TaskEmailNotifications__FrontendBaseUrl
        sync: false
      - key: GmailIntegration__ClientId
        sync: false
      - key: GmailIntegration__ClientSecret
        sync: false
      - key: GmailIntegration__TokenEncryptionKey
        sync: false
