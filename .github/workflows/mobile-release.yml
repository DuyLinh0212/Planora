name: Mobile Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag, for example v1.0.0
        required: true
        type: string

permissions:
  contents: write
  checks: read

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Signed Android release
    runs-on: ubuntu-latest
    environment:
      name: production
    defaults:
      run:
        working-directory: mobile/user-app
    env:
      PLANORA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      PLANORA_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      PLANORA_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Require a tested commit from main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::Releases can only use a commit reachable from main."
            exit 1
          }
          successful=$(gh api \
            "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs" \
            --jq '[.check_runs[] | select(.name == "CI success" and .conclusion == "success")] | length')
          test "$successful" -ge 1 || {
            echo "::error::The release commit has no successful CI success check."
            exit 1
          }

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.7
          channel: stable
          cache: true

      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          required=(ANDROID_KEYSTORE_BASE64 PLANORA_ANDROID_KEYSTORE_PASSWORD PLANORA_ANDROID_KEY_ALIAS PLANORA_ANDROID_KEY_PASSWORD)
          for name in "${required[@]}"; do
            test -n "${!name:-}" || { echo "::error::$name is not configured."; exit 1; }
          done
          keystore="$RUNNER_TEMP/planora-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          echo "PLANORA_ANDROID_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

      - name: Restore packages
        run: flutter pub get --enforce-lockfile

      - name: Test
        run: flutter test

      - name: Build signed APK and App Bundle
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          tag="${REQUESTED_TAG:-$GITHUB_REF_NAME}"
          version_name="${tag#v}"
          [[ "$version_name" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]] || {
            echo "::error::Release tag must use semantic versioning, for example v1.2.3."
            exit 1
          }
          flutter build apk --release --build-name="$version_name" --build-number="$GITHUB_RUN_NUMBER"
          flutter build appbundle --release --build-name="$version_name" --build-number="$GITHUB_RUN_NUMBER"

      - name: Upload signed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: planora-android-release
          path: |
            mobile/user-app/build/app/outputs/flutter-apk/app-release.apk
            mobile/user-app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          tag="${REQUESTED_TAG:-$GITHUB_REF_NAME}"
          artifacts=(
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          )
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${artifacts[@]}" --clobber
          else
            gh release create "$tag" "${artifacts[@]}" \
              --target "$GITHUB_SHA" \
              --generate-notes \
              --title "Planora $tag"
          fi
