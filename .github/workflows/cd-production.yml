name: Deploy Production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Commit SHA to deploy (empty means current commit)
        required: false
        type: string

permissions:
  contents: read
  checks: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Render + Vercel
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || inputs.commit_sha || github.sha }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
      PLANORA_API_URL: ${{ vars.PLANORA_API_URL }}
      PLANORA_GOOGLE_CLIENT_ID: ${{ vars.PLANORA_GOOGLE_CLIENT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          required=(
            RENDER_API_KEY
            RENDER_SERVICE_ID
            PLANORA_API_URL
            PLANORA_GOOGLE_CLIENT_ID
            VERCEL_TOKEN
            VERCEL_ORG_ID
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name is not configured in the production environment."
              exit 1
            fi
          done

      - uses: actions/checkout@v5
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 0

      - name: Require a tested commit from main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$DEPLOY_SHA" origin/main || {
            echo "::error::Production can only deploy a commit reachable from main."
            exit 1
          }

          successful=$(gh api \
            "repos/$GITHUB_REPOSITORY/commits/$DEPLOY_SHA/check-runs" \
            --jq '[.check_runs[] | select(.name == "CI success" and .conclusion == "success")] | length')
          if [[ "$successful" -lt 1 ]]; then
            echo "::error::The selected commit has no successful CI success check."
            exit 1
          fi

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            frontend/Planora.Web.User/package-lock.json
            frontend/Planora.Web.Admin/package-lock.json

      - name: Deploy the tested API commit to Render
        id: render
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            --header "Content-Type: application/json" \
            --data "{\"commitId\":\"$DEPLOY_SHA\",\"clearCache\":\"do_not_clear\"}")
          deploy_id=$(jq -r '.id // empty' <<<"$response")
          if [[ -z "$deploy_id" ]]; then
            echo "::error::Render did not return a deployment id."
            exit 1
          fi
          echo "deploy-id=$deploy_id" >> "$GITHUB_OUTPUT"

          for attempt in {1..90}; do
            deployment=$(curl --fail-with-body --silent --show-error \
              --url "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$deploy_id" \
              --header "Authorization: Bearer $RENDER_API_KEY")
            status=$(jq -r '.status // empty' <<<"$deployment")
            echo "Render deployment status: $status"

            case "$status" in
              live) break ;;
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                echo "::error::Render deployment ended with status $status."
                exit 1
                ;;
            esac

            if [[ "$attempt" == "90" ]]; then
              echo "::error::Timed out waiting for Render deployment."
              exit 1
            fi
            sleep 20
          done

      - name: Verify API readiness
        shell: bash
        run: curl --fail-with-body --retry 12 --retry-all-errors --retry-delay 10 "$PLANORA_API_URL/health/ready"

      - name: Generate frontend production configuration
        run: |
          node tools/ci/write-frontend-environment.mjs user
          node tools/ci/write-frontend-environment.mjs admin

      - name: Deploy user web to Vercel
        id: user-web
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_USER_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_PROJECT_ID" || { echo "::error::VERCEL_USER_PROJECT_ID is not configured."; exit 1; }
          npx --yes vercel@59.11.2 pull --yes --environment=production --token="$VERCEL_TOKEN" --cwd frontend/Planora.Web.User
          npx --yes vercel@59.11.2 build --prod --token="$VERCEL_TOKEN" --cwd frontend/Planora.Web.User
          url=$(npx --yes vercel@59.11.2 deploy --prebuilt --prod --token="$VERCEL_TOKEN" --cwd frontend/Planora.Web.User)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Deploy admin web to Vercel
        id: admin-web
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_ADMIN_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_PROJECT_ID" || { echo "::error::VERCEL_ADMIN_PROJECT_ID is not configured."; exit 1; }
          npx --yes vercel@59.11.2 pull --yes --environment=production --token="$VERCEL_TOKEN" --cwd frontend/Planora.Web.Admin
          npx --yes vercel@59.11.2 build --prod --token="$VERCEL_TOKEN" --cwd frontend/Planora.Web.Admin
          url=$(npx --yes vercel@59.11.2 deploy --prebuilt --prod --token="$VERCEL_TOKEN" --cwd frontend/Planora.Web.Admin)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Deployment summary
        shell: bash
        env:
          USER_WEB_URL: ${{ steps.user-web.outputs.url }}
          ADMIN_WEB_URL: ${{ steps.admin-web.outputs.url }}
          RENDER_DEPLOY_ID: ${{ steps.render.outputs.deploy-id }}
        run: |
          {
            echo "## Production deployment"
            echo ""
            echo "- Commit: \`$DEPLOY_SHA\`"
            echo "- API: $PLANORA_API_URL"
            echo "- Render deploy: \`$RENDER_DEPLOY_ID\`"
            echo "- User web: $USER_WEB_URL"
            echo "- Admin web: $ADMIN_WEB_URL"
          } >> "$GITHUB_STEP_SUMMARY"
